<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>폐관 기록 · 도트 그래픽 전후 비교</title><style>*{box-sizing:border-box}body{margin:0;background:#142b31;color:#e4d6b1;font:16px/1.7 'Malgun Gothic',sans-serif}main{max-width:1350px;margin:auto;padding:26px}h1{font:30px/1.5 Batang,serif;margin:0}p{color:#b8c6ad;font-size:14px}label{display:block;margin:24px 0}select{font:inherit;min-width:270px;background:#29433c;color:#e4d6b1;border:1px solid #9f9f70;padding:9px;margin-left:12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.frame{min-width:0}h2{font-size:15px;font-weight:400;letter-spacing:.06em}img{width:100%;height:auto;image-rendering:pixelated;border:1px solid #7f906b;display:block}.after h2{color:#ecd295}small{font-size:12px;color:#afc1a6}@media(max-width:900px){.pair{grid-template-columns:1fr}main{padding:16px}select{display:block;margin:8px 0 0}}</style><main><h1>여섯 번째 새벽 · 도트 그래픽 고도화</h1><p>640×360 원본, 동일한 상태와 프레임의 변경 전·후 비교. 아래 이미지는 미술 검토용 고정 상태이며 실제 정상 플레이 검증과 구분합니다.</p><label>비교할 공간<select id="scene"></select></label><div class="pair"><section class="frame"><h2>변경 전 · v1.0</h2><img id="before" alt="변경 전 도트 공간"></section><section class="frame after"><h2>변경 후 · v1.1</h2><img id="after" alt="변경 후 도트 공간"></section></div><p id="caption"></p><small>이 파일과 art-before·art-after 폴더를 함께 보관하면 인터넷 없이 볼 수 있습니다.</small></main><script>const frames=[{"id":"reception-initial","label":"접수대 · 복구 전","before":"art-before/reception-initial.png","after":"art-after/reception-initial.png"},{"id":"reception-restored","label":"접수대 · 복구 후","before":"art-before/reception-restored.png","after":"art-after/reception-restored.png"},{"id":"hall-initial","label":"회전 회랑 · 복구 전","before":"art-before/hall-initial.png","after":"art-after/hall-initial.png"},{"id":"hall-restored","label":"회전 회랑 · 복구 후","before":"art-before/hall-restored.png","after":"art-after/hall-restored.png"},{"id":"archive-initial","label":"기록보관소 · 복구 전","before":"art-before/archive-initial.png","after":"art-after/archive-initial.png"},{"id":"archive-restored","label":"기록보관소 · 복구 후","before":"art-before/archive-restored.png","after":"art-after/archive-restored.png"},{"id":"greenhouse-initial","label":"침수 온실 · 복구 전","before":"art-before/greenhouse-initial.png","after":"art-after/greenhouse-initial.png"},{"id":"greenhouse-restored","label":"침수 온실 · 복구 후","before":"art-before/greenhouse-restored.png","after":"art-after/greenhouse-restored.png"},{"id":"observatory-initial","label":"야간 천문대 · 복구 전","before":"art-before/observatory-initial.png","after":"art-after/observatory-initial.png"},{"id":"observatory-restored","label":"야간 천문대 · 복구 후","before":"art-before/observatory-restored.png","after":"art-after/observatory-restored.png"},{"id":"theater-initial","label":"종이 인형극장 · 복구 전","before":"art-before/theater-initial.png","after":"art-after/theater-initial.png"},{"id":"theater-restored","label":"종이 인형극장 · 복구 후","before":"art-before/theater-restored.png","after":"art-after/theater-restored.png"},{"id":"postoffice-initial","label":"무인 우편 교환국 · 복구 전","before":"art-before/postoffice-initial.png","after":"art-after/postoffice-initial.png"},{"id":"postoffice-restored","label":"무인 우편 교환국 · 복구 후","before":"art-before/postoffice-restored.png","after":"art-after/postoffice-restored.png"},{"id":"clockwork-initial","label":"멈춘 시계 공방 · 복구 전","before":"art-before/clockwork-initial.png","after":"art-after/clockwork-initial.png"},{"id":"clockwork-restored","label":"멈춘 시계 공방 · 복구 후","before":"art-before/clockwork-restored.png","after":"art-after/clockwork-restored.png"},{"id":"exit-initial","label":"출구 기관실 · 복구 전","before":"art-before/exit-initial.png","after":"art-after/exit-initial.png"},{"id":"exit-restored","label":"출구 기관실 · 복구 후","before":"art-before/exit-restored.png","after":"art-after/exit-restored.png"},{"id":"ending-preserve","label":"아침 · 공용 보존","before":"art-before/ending-preserve.png","after":"art-after/ending-preserve.png"},{"id":"ending-return","label":"아침 · 개인 반환","before":"art-before/ending-return.png","after":"art-after/ending-return.png"}];const select=document.querySelector('#scene');for(const [i,frame]of frames.entries()){const option=document.createElement('option');option.value=i;option.textContent=frame.label;select.append(option);}function show(){const frame=frames[Number(select.value)];document.querySelector('#before').src=frame.before;document.querySelector('#after').src=frame.after;document.querySelector('#caption').textContent=frame.label+' · 정수 픽셀 윤곽, 재질 명암, 조명, 소품과 복구 상태를 비교하세요.';}select.addEventListener('change',show);show();</script></html>
